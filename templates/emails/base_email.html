<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="color-scheme" content="light only">
    <meta name="supported-color-schemes" content="light">
    <title>{% block title %}Tilto{% endblock %}</title>
    <!--[if mso]>
    <style type="text/css">
        body, table, td {font-family: Arial, sans-serif !important;}
    </style>
    <![endif]-->
</head>
<body style="margin: 0; padding: 0; font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background-color: #f9fafb;">
    
    <!-- Wrapper -->
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color: #f9fafb;">
        <tr>
            <td style="padding: 40px 20px;">
                
                <!-- Container principal -->
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);">
                    
                    <!-- Header avec gradient Tilto -->
                    <tr>
                        <td style="background: linear-gradient(135deg, #A11857 0%, #8b1a6b 100%); padding: 40px; border-radius: 16px 16px 0 0; text-align: center;">
                            <h1 style="margin: 0; color: #ffffff; font-size: 32px; font-weight: 700; line-height: 1.2;">
                                {% block header_title %}Tilto{% endblock %}
                            </h1>
                            {% block header_subtitle %}{% endblock %}
                        </td>
                    </tr>
                    
                    <!-- Contenu principal -->
                    <tr>
                        <td style="padding: 40px;">
                            {% block content %}
                            <!-- Le contenu spécifique de chaque email ici -->
                            {% endblock %}
                        </td>
                    </tr>
                    
                    <!-- Divider -->
                    <tr>
                        <td style="padding: 0 40px;">
                            <div style="border-top: 1px solid #e5e7eb;"></div>
                        </td>
                    </tr>
                    
                    <!-- Footer -->
                    <tr>
                        <td style="padding: 32px 40px; text-align: center;">
                            
                            <!-- Logo/Titre -->
                            <p style="margin: 0 0 16px; color: #A11857; font-size: 20px; font-weight: 700;">
                                Tilto
                            </p>
                            
                            <!-- Tagline -->
                            <p style="margin: 0 0 20px; color: #666666; font-size: 14px;">
                                Le nouveau réflexe pro
                            </p>
                            
                            <!-- Links sociaux/site -->
                            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                                <tr>
                                    <td align="center">
                                        <a href="https://tilto.co" style="color: #A11857; text-decoration: none; font-size: 14px; font-weight: 600; margin: 0 12px;">
                                            tilto.co
                                        </a>
                                        <span style="color: #d1d5db; margin: 0 8px;">|</span>
                                        <a href="mailto:contact@tilto.ai" style="color: #A11857; text-decoration: none; font-size: 14px; font-weight: 600; margin: 0 12px;">
                                            contact@tilto.ai
                                        </a>
                                    </td>
                                </tr>
                            </table>
                            
                            <!-- Legal -->
                            <p style="margin: 24px 0 0; color: #9ca3af; font-size: 12px; line-height: 1.5;">
                                {% block footer_legal %}
                                Tu reçois cet email car tu utilises Tilto.<br>
                                {% endblock %}
                                <a href="{{ url_for('privacy_policy', _external=True) }}" style="color: #9ca3af; text-decoration: underline;">Politique de confidentialité</a>
                            </p>
                            
                        </td>
                    </tr>
                    
                </table>
                <!-- Fin container principal -->
                
            </td>
        </tr>
    </table>
    <!-- Fin wrapper -->
    
</body>
</html>
