<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<style>
/* Espace Tilto Pro : mêmes couleurs et polices que la landing /pro */
.tilto-pro-app main { padding: 0 !important; max-width: none !important; margin: 0 !important; }
.tilto-pro-app main > * { max-width: none !important; }
.tilto-pro-app {
    --tp-primary: #A11857; --tp-primary-dark: #7a1142; --tp-primary-deep: #4A0B27;
    --tp-primary-light: #FDF2F8; --tp-rose-pale: #EBD5E3;
    --tp-ink: #2A1220; --tp-text: #3B3036; --tp-muted: #6B5F66;
    --tp-cream: #FAF7F2; --tp-line: #EDE4E8; --tp-white: #FFFFFF;
    --tp-gold: #FFB400; --tp-gold-light: #FFD54F; --tp-gold-pale: #FFF4D6;
    --tp-ok: #1F7A4D; --tp-ok-pale: #E7F4EC;
}
.tilto-pro-app .tpa { font-family: 'DM Sans', system-ui, sans-serif; color: var(--tp-text); background: var(--tp-cream); min-height: 100vh; }
.tilto-pro-app .tpa h1, .tilto-pro-app .tpa h2, .tilto-pro-app .tpa h3 { text-align: left; color: var(--tp-ink); margin: 0; }
.tilto-pro-app .tpa h1, .tilto-pro-app .tpa h2 { font-family: 'Fraunces', Georgia, serif; letter-spacing: -0.02em; overflow-wrap: break-word; }
.tilto-pro-app .tpa h1 { font-size: clamp(1.9rem, 4vw, 2.6rem); line-height: 1.08; font-weight: 800; }
.tilto-pro-app .tpa h2 { font-size: 1.4rem; line-height: 1.2; font-weight: 700; }
.tilto-pro-app .tpa h3 { font-size: 1.05rem; line-height: 1.3; }
.tilto-pro-app .tpa p { margin: 0; line-height: 1.6; }
.tilto-pro-app .tpa a { color: var(--tp-primary); }
.tilto-pro-app .tpa-wrap { max-width: 1040px; margin: 0 auto; padding: 120px 40px 80px; box-sizing: border-box; }
.tilto-pro-app .tpa-narrow { max-width: 760px; }
.tilto-pro-app .tpa-eyebrow { font-size: 0.8rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--tp-primary); margin-bottom: 10px !important; }
.tilto-pro-app .tpa-sub { margin-top: 10px !important; font-size: 1.05rem; color: var(--tp-muted); }
.tilto-pro-app .tpa-card { background: var(--tp-white); border: 1px solid var(--tp-line); border-radius: 16px; padding: 24px; box-sizing: border-box; }
.tilto-pro-app .tpa-back { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-weight: 600; font-size: 0.95rem; text-decoration: none; margin-bottom: 8px; }

/* Boutons */
.tilto-pro-app .tpa-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: 10px; border: 0; font: inherit; font-size: 1rem; font-weight: 700; cursor: pointer; text-decoration: none; box-sizing: border-box; transition: background 0.2s; }
.tilto-pro-app .tpa-btn--primary { background: var(--tp-primary); color: var(--tp-white) !important; }
.tilto-pro-app .tpa-btn--primary:hover { background: var(--tp-primary-dark); }
.tilto-pro-app .tpa-btn--ghost { background: var(--tp-white); color: var(--tp-primary) !important; border: 1.5px solid var(--tp-primary); }
.tilto-pro-app .tpa-btn--ghost:hover { background: var(--tp-primary-light); }
.tilto-pro-app .tpa-btn--gold { background: var(--tp-gold-light); color: #4A2E00 !important; }
.tilto-pro-app .tpa-btn--gold:hover { background: var(--tp-gold); }
.tilto-pro-app .tpa-btn[disabled], .tilto-pro-app .tpa-btn.is-disabled { background: #E9E4E6 !important; color: #8A7F85 !important; border-color: #E9E4E6 !important; cursor: not-allowed; pointer-events: none; }

/* Statuts */
.tilto-pro-app .tpa-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 700; border-radius: 999px; padding: 5px 11px; white-space: nowrap; }
.tilto-pro-app .tpa-badge--fiche, .tilto-pro-app .tpa-badge--audio { background: var(--tp-gold-pale); color: #6B4A00; }
.tilto-pro-app .tpa-badge--analyse { background: var(--tp-primary-light); color: var(--tp-primary); }
.tilto-pro-app .tpa-badge--pret { background: var(--tp-ok-pale); color: var(--tp-ok); }
.tilto-pro-app .tpa-badge--free { background: var(--tp-primary-light); color: var(--tp-primary); }

/* Formulaires */
.tilto-pro-app .tpa-field { display: flex; flex-direction: column; gap: 6px; }
.tilto-pro-app .tpa-field > label, .tilto-pro-app .tpa-legend { font-size: 0.92rem; font-weight: 600; color: var(--tp-ink); }
.tilto-pro-app .tpa-field input[type="text"], .tilto-pro-app .tpa-field input[type="number"], .tilto-pro-app .tpa-field textarea { font: inherit; font-size: 16px; color: var(--tp-ink); padding: 12px 14px; border: 1px solid #D9CCD2; border-radius: 10px; min-height: 48px; box-sizing: border-box; background: var(--tp-white); width: 100%; }
.tilto-pro-app .tpa-field textarea { min-height: 110px; resize: vertical; }
.tilto-pro-app .tpa-field input:focus, .tilto-pro-app .tpa-field textarea:focus { outline: 2px solid var(--tp-primary); outline-offset: 1px; border-color: var(--tp-primary); }
.tilto-pro-app .tpa-hint { font-size: 0.85rem; color: var(--tp-muted); }
.tilto-pro-app .tpa-req { color: var(--tp-primary); }
.tilto-pro-app .tpa-choices { display: flex; flex-wrap: wrap; gap: 8px; border: 0; margin: 0; padding: 0; }
.tilto-pro-app .tpa-choice { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border: 1px solid #D9CCD2; border-radius: 10px; background: var(--tp-white); cursor: pointer; font-size: 0.95rem; }
.tilto-pro-app .tpa-choice input { width: 18px; height: 18px; accent-color: var(--tp-primary); margin: 0; }
.tilto-pro-app .tpa-choice:has(input:checked) { border-color: var(--tp-primary); background: var(--tp-primary-light); }
.tilto-pro-app .tpa-grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.tilto-pro-app .tpa-errors { background: #FEF2F2; color: #991B1B; border: 1px solid #FECACA; border-radius: 12px; padding: 14px 18px; font-size: 0.92rem; }
.tilto-pro-app .tpa-errors ul { margin: 6px 0 0; padding-left: 18px; }

/* Pastilles et blocs numérotés (parcours du dossier) */
.tilto-pro-app .tpa-gift { display: inline-flex; align-items: center; gap: 10px; background: var(--tp-primary-light); color: var(--tp-primary); font-weight: 700; border-radius: 12px; padding: 12px 18px; }
.tilto-pro-app .tpa-gift svg { flex: 0 0 auto; }
.tilto-pro-app .tpa-block { margin-top: 18px; }
.tilto-pro-app .tpa-block-head { display: flex; gap: 14px; align-items: center; }
/* Numéro d'étape : chiffre éditorial, sans fond, pour ne ressembler ni aux icônes ni à un bouton */
.tilto-pro-app .tpa-num { flex: 0 0 auto; font-family: 'Fraunces', Georgia, serif; font-size: 2rem; font-weight: 700; line-height: 1; color: var(--tp-primary); padding-right: 14px; border-right: 1.5px solid var(--tp-line); font-variant-numeric: lining-nums; }
.tilto-pro-app .tpa-block-head h2 { font-size: 1.5rem; }
.tilto-pro-app .tpa-lead { margin-top: 12px !important; font-size: 1rem; color: var(--tp-muted); }
.tilto-pro-app .tpa-check { display: flex; gap: 10px; align-items: flex-start; min-height: 44px; padding-top: 10px; font-size: 0.97rem; cursor: pointer; }
.tilto-pro-app .tpa-check input { flex: 0 0 auto; width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--tp-primary); }
.tilto-pro-app .tpa-note { font-size: 0.88rem; color: var(--tp-muted); margin-top: 10px !important; }

@media (max-width: 768px) {
    .tilto-pro-app .tpa-wrap { padding: 104px 16px 112px; }
    /* styles.css force « section { margin: 0; padding-left/right: 0 } !important » sur mobile */
    .tilto-pro-app section.tpa-card { padding-left: 18px !important; padding-right: 18px !important; }
    .tilto-pro-app section.tpa-block, .tilto-pro-app .tpa section:not(:first-child) { margin-top: 20px !important; }
    .tilto-pro-app #tpc-form > section.tpa-block:first-of-type { margin-top: 0 !important; }
    /* Bulle d'aide : l'étiquette « Une question ? » masquait le contenu sur mobile */
    .tilto-pro-app .chat-bubble::before, .tilto-pro-app .chat-bubble::after { display: none !important; }
    .tilto-pro-app .tpa-card { padding: 18px; }
    .tilto-pro-app .tpa-grid-2 { grid-template-columns: 1fr; }
    .tilto-pro-app .tpa-btn { width: 100%; }
}
</style>
<script nonce="{{ g.nonce }}">
/* Suivi du parcours coach dans Analytics : tpTrack('nom', {…}) ou attribut data-track
   (+ data-track-kind) sur un lien ou un bouton. Envoi en « beacon » : l'événement part
   même si la page change juste après. */
window.tpTrack = function (name, params) {
    if (typeof gtag !== 'function') return;
    var p = { event_category: 'tilto_pro', transport_type: 'beacon' };
    for (var k in (params || {})) p[k] = params[k];
    gtag('event', name, p);
};
document.addEventListener('click', function (e) {
    var el = e.target.closest && e.target.closest('[data-track]');
    if (el) window.tpTrack(el.dataset.track, el.dataset.trackKind ? { kind: el.dataset.trackKind } : {});
});
</script>
