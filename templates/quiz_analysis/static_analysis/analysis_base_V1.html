{% extends "base.html" %}

{% block extra_css %}
<style nonce="{{ g.nonce }}">
    /* ===== STYLES SPÉCIFIQUES ANALYSE COACHING V1===== */
    /* Uniquement les styles qui ne sont PAS dans main.css */

        /* ===== PROGRESS BAR ===== */
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--bg-light);
            z-index: 1000;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            width: 0%;
            transition: width 0.3s ease;
        }


        /* ===== COVER PAGE ===== */
        .cover-page {
            min-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #A11857 0%, #8b1a6b 100%);
            position: relative;
            overflow: hidden;
        }

        .cover-content {
            text-align: center;
            color: white;
            z-index: 2;
            max-width: 700px;
            padding: 60px 40px;
            animation: fadeInUp 0.8s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .cover-badge {
            display: inline-block;
            padding: 10px 24px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 40px;
            font-weight: 600;
            animation: fadeIn 1s ease 0.2s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .cover-name {
            font-size: 80px;
            font-weight: 900;
            margin: 30px 0;
            letter-spacing: -3px;
            line-height: 1;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            animation: fadeIn 1s ease 0.4s both;
            color: white;
        }

        .cover-subtitle {
            font-size: 22px;
            opacity: 0.95;
            margin-bottom: 50px;
            font-weight: 300;
            letter-spacing: 0.5px;
            animation: fadeIn 1s ease 0.6s both;
        }

        .cover-meta {
            display: flex;
            gap: 20px;
            justify-content: center;
            font-size: 17px;
            opacity: 0.85;
            flex-wrap: wrap;
            animation: fadeIn 1s ease 0.8s both;
        }

        .cover-pattern {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 60px,
                rgba(255, 255, 255, 0.03) 60px,
                rgba(255, 255, 255, 0.03) 120px
            );
            z-index: 1;
        }

        .cover-logo {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 26px;
            font-weight: 700;
            opacity: 0.8;
            letter-spacing: 4px;
            z-index: 2;
            color:white;
        }

        /* ===== MAIN CONTENT ===== */
        .main-content-analysis {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            box-shadow: 0 0 80px rgba(97, 5, 69, 0.08);
        }

        /* ===== SECTIONS ===== */
        .section {
            padding: 60px 0;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            padding-left: 40px;
            padding-right: 40px;
        }

        .section::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            border-radius: 2px;
            opacity: 0.6;
        }

        .section.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .section-title {
            font-size: 32px;
            font-weight: 800;
            color: #2c3e50;
            margin-bottom: 24px;
            line-height: 1.2;
            position: relative;
            padding-left: 80px;
            letter-spacing: -0.02em;
        }

        .section-title::before {
            content: attr(data-number);
            position: absolute;
            left: 0;
            top: -5px;
            font-size: 48px;
            font-weight: 900;
            color: var(--accent);
            opacity: 0.7;
            line-height: 1;
        }

        .section-subtitle {
            font-size: 18px;
            color: var(--text-light);
            margin-bottom: 32px;
            line-height: 1.5;
        }

        /* ===== HERO SECTION ===== */
        .hero_start {
            padding: 4rem 2rem 4rem 2rem;
            text-align: center;
            position: relative;
        }

        .hero_start::before {
            content: '';
            position: absolute;
            top: -80px;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, 
                var(--primary) 0%, 
                var(--accent) 50%, 
                var(--primary) 100%);
        }

         .hero_start-subtitle {
            font-size: 26px;
            color: #747C92;
            font-style: italic;
            margin-bottom: 40px;
            font-weight: 700;
        }

        .hero_start-intro {
            font-size: 18px;
            line-height: 1.8;
            color: #747C92;
            max-width: 680px;
            margin: 0 auto 40px;
        }

        .hero_start-intro strong {
            color: var(--primary);
            font-weight: 700;
        }

/* Tabs Navigation avec Progress */
.tabs-nav {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 2.5rem;
    margin-bottom: 48px;
    position: relative;
    padding: 0 60px;
}

.tab-btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 2px solid rgba(249, 184, 114, 0.35);
    background: white;
    color: rgba(97, 5, 69, 0.4);
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 2;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(97, 5, 69, 0.04);
}

.tab-btn:hover:not(.active) {
    border-color: #F59E0B;
    transform: scale(1.08);
    box-shadow: 0 4px 12px rgba(97, 5, 69, 0.1);
    color: #F59E0B;
}

.tab-btn.active {
    width: 60px;
    height: 60px;
    background:#F59E0B;
    color: white;
    border-color:#F59E0B;
    box-shadow: 0 8px 24px rgba(97, 5, 69, 0.3);
    font-size: 19px;
}



/* Tab complété = clairement différent */
.tab-btn.completed {
    background: #F59E0B;
    border-color: #F59E0B;
    color: white;
    opacity: 0.5;
    box-shadow: 0 2px 8px rgba(97, 5, 69, 0.15);
}

.tab-btn.completed:hover {
    opacity: 0.7;
}

/* Tabs Content Wrapper */
.tabs-content-wrapper {
    position: relative;
    min-height: 380px;
    background: white;
    padding: 32px;
}

.tab-content {
    display: none;
    opacity: 0;
    animation: fadeIn 0.4s ease forwards;
}

.tab-content.active {
    display: block;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Transform zones */
.transform-negative {
    background: #f8f8f8;
    border: 1.5px solid rgba(163, 163, 163, 0.12);
    border-left: 4px solid rgba(163, 163, 163, 0.3);
    padding: 24px;
    border-radius: 12px;
    margin-bottom: 20px;
}

.transform-positive {
    background: linear-gradient(135deg, 
        rgba(249, 184, 114, 0.12) 0%, 
        rgba(255, 235, 205, 0.15) 100%);
    border: 1.5px solid rgba(249, 184, 114, 0.25);
    border-left: 4px solid var(--accent);
    padding: 24px;
    border-radius: 12px;
    margin-top: 20px;
}


.transform-label {
    font-size: 11px;
    font-weight: 700;
    margin-bottom: 14px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
}

.transform-negative .transform-label {
    color: #666;
}

.transform-positive .transform-label {
    color: var(--accent);
}

.transform-text {
    font-size: 17px;
    line-height: 1.7;
    color: var(--text);
}

.transform-negative .transform-text {
    font-style: italic;
    opacity: 0.9;
}

.transform-positive .transform-text {
    font-weight: 500;
}

.transformation-arrow {
    text-align: center;
    font-size: 2.5rem;
    color: #2c3e50;
    font-weight: bold;
    margin: 20px 0;
}

/* Mobile */
/* Mobile */
@media (max-width: 768px) {
    .tabs-nav {
        padding: 0 20px;
        gap: 1.5rem;
    }
    
    .tab-btn {
        width: 44px;
        height: 44px;
        font-size: 15px;
    }
    
    .tab-btn.active {
        width: 50px;
        height: 50px;
        font-size: 17px;
    }

    
    .tabs-content-wrapper {
        padding: 24px;
        min-height: 340px;
    }
    
    .transform-negative,
    .transform-positive {
        padding: 20px;
    }
}

/* ===== FINALE PREMIUM ÉPURÉE ===== */

.section-finale {

/* Texture grain ultra-fine */
.section-finale::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.015'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
}

.section-finale::before {
    display: none;
}

/* Point central */
.center-node {
    position: absolute;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 90px;
    height: 90px;
    z-index: 10;
}

.center-node-inner {
    width: 100%;
    height: 100%;
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-radius: 50%;
    border: 2px solid rgba(157, 37, 121, 0.2);
    box-shadow: 
        0 0 0 1px rgba(97, 5, 69, 0.04),
        0 8px 32px rgba(97, 5, 69, 0.12),
        inset 0 0 0 1px rgba(255, 255, 255, 0.5);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

.center-node-inner::after {
    content: '';
    position: absolute;
    inset: 20px;
    background: linear-gradient(135deg, #A11857, #A11857);
    border-radius: 50%;
    opacity: 0.15;
}

/* Canvas pour les chemins */
.paths-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 240px;
    pointer-events: none;
}

.organic-path {
    fill: none;
    stroke-width: 5;
    stroke-linecap: round;
    opacity: 0;
    animation: fadeInPath 1.2s ease-out forwards;
}

.organic-path.path-1 {
    stroke: rgba(255, 192, 235, 0.85);
    animation-delay: 0.3s;
}

.organic-path.path-2 {
    stroke: rgba(247, 191, 95, 0.85);
    animation-delay: 0.5s;
}

.organic-path.path-3 {
    stroke: rgba(133, 224, 163, 0.85);
    animation-delay: 0.7s;
}

@keyframes fadeInPath {
    to {
        opacity: 1;
    }
}

/* Voies destinations */
.voies-destinations {
    position: relative;
    margin-top: 200px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
    padding: 0 1rem;
}

.voie-destination {
    opacity: 0;
    transform: translateY(20px);
    animation: fadeInUp 0.6s ease-out forwards;
}

.voie-destination:nth-child(1) {
    animation-delay: 0.9s;
}

.voie-destination:nth-child(2) {
    animation-delay: 1.1s;
}

.voie-destination:nth-child(3) {
    animation-delay: 1.3s;
}

@keyframes fadeInUp {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.voie-destination-card {
    background: white;
    padding-top: 1.5rem;
    padding-left: 1rem;
    padding-right: 1rem;
    padding-bottom: 3rem;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    text-align: center;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border: 3px solid transparent;
    min-height: 180px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    overflow: visible;
}

.voie-destination-card::after {
    content: '→';
    position: absolute;
    bottom: 0.75rem;
    left: 50%;
    transform: translateX(-50%);
    font-size: 1.25rem;
    opacity: 0;
    transition: all 0.3s ease;
    color: var(--primary);
}

.voie-destination-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 32px rgba(97, 5, 69, 0.15);
}

.voie-destination-card:hover::after {

}

.voie-destination-card:active {

}

.voie-destination-card.jaune {

}

.voie-destination-card.jaune:hover {
    border-color: var(--jaune);
}

.voie-destination-card.vert {
    border-color: rgba(133, 224, 163, 0.5);

.voie-destination-icon {

// ===== TOAST NOTIFICATIONS AMÉLIORÉES =====
function showToast(message, duration = 3000) {
    // Supprime l'ancien toast s'il existe
    const existingToast = document.getElementById('tilto-toast');
    if (existingToast) {
        existingToast.remove();
    }
    
    // Crée le nouveau toast
    const toast = document.createElement('div');
    toast.id = 'tilto-toast';
    toast.innerHTML = `
        <div class="toast-content">
            <span class="toast-message">${message}</span>
        </div>
    `;
    
    // Styles inline (ou ajoute dans ton CSS)
    toast.style.cssText = `
        position: fixed;
        bottom: 100px;

}

// ===== VOIES NAVIGATION =====
let currentVoie = 0;

function goToVoieDetail(voieNumber) {
    const optionsSection = document.getElementById('section-options');
    const voieSection = document.getElementById('voieDetail' + voieNumber);
    
    if (!voieSection) return;
    
    // Direction de l'animation
    const isNext = voieNumber > currentVoie;
    
    // Si on vient de la section options
    if (currentVoie === 0) {
        // Slide out la section options vers la gauche
        optionsSection.classList.add('slide-out-left');
        
        // Préparer la voie à droite
        voieSection.style.display = 'block';
        voieSection.classList.remove('slide-out-left', 'slide-out-right');
        
        // Petit délai puis slide in
        setTimeout(() => {
            voieSection.classList.add('active');
        }, 50);
    } else {
        // Navigation entre voies
        const currentVoieSection = document.getElementById('voieDetail' + currentVoie);
        
        if (isNext) {
            // Slide out current vers la gauche
            currentVoieSection.classList.remove('active');
            currentVoieSection.classList.add('slide-out-left');
        } else {
            // Slide out current vers la droite
            currentVoieSection.classList.remove('active');
            currentVoieSection.classList.add('slide-out-right');
        }
        
        // Préparer la nouvelle voie
        voieSection.style.display = 'block';
        if (isNext) {
            voieSection.classList.remove('slide-out-left');
            voieSection.classList.add('slide-out-right');
        } else {
            voieSection.classList.remove('slide-out-right');
            voieSection.classList.add('slide-out-left');
        }
        
        // Slide in la nouvelle voie
        setTimeout(() => {
            voieSection.classList.remove('slide-out-left', 'slide-out-right');
            voieSection.classList.add('active');
        }, 50);
        
        // Cacher l'ancienne voie après l'animation
        setTimeout(() => {
            currentVoieSection.style.display = 'none';
            currentVoieSection.classList.remove('slide-out-left', 'slide-out-right');
        }, 450);
    }
    
    currentVoie = voieNumber;
}

function backToOptions() {
    const optionsSection = document.getElementById('section-options');
    const currentVoieSection = document.getElementById('voieDetail' + currentVoie);
    
    if (!currentVoieSection) return;
    
    // Slide out la voie vers la droite
    currentVoieSection.classList.remove('active');
    currentVoieSection.classList.add('slide-out-right');
    
    // Slide in la section options depuis la gauche
    optionsSection.classList.remove('slide-out-left');
    optionsSection.classList.add('slide-back');
    
    // Scroll vers la section options
    setTimeout(() => {
        const optionsOffset = optionsSection.offsetTop - 100;
        window.scrollTo({
            top: optionsOffset,
            behavior: 'smooth'
        });
    }, 100);
    
    // Cacher la voie après l'animation
    setTimeout(() => {
        currentVoieSection.style.display = 'none';
        currentVoieSection.classList.remove('slide-out-right');
    }, 450);
    
    currentVoie = 0;
}

// Throttle function pour limiter les appels
function throttle(func, delay) {
    let timeoutId;
    let lastRan;
    return function(...args) {
        if (!lastRan) {
            func.apply(this, args);
            lastRan = Date.now();
        } else {
            clearTimeout(timeoutId);
            timeoutId = setTimeout(() => {
                if ((Date.now() - lastRan) >= delay) {
                    func.apply(this, args);
                    lastRan = Date.now();
                }
            }, delay - (Date.now() - lastRan));
        }
    };
}

// Progress bar optimisée
function updateProgressBar() {
    const winScroll = document.documentElement.scrollTop;
    const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
    const scrolled = (winScroll / height) * 100;
    document.getElementById('progressFill').style.width = scrolled + '%';
}


// Sticky CTA optimisé
function updateStickyCta() {
    const stickyCta = document.getElementById('stickyCta');
    if (window.scrollY > 500) {
        stickyCta.classList.add('visible');
    } else {
        stickyCta.classList.remove('visible');
    }
}

// ===== INTERSECTION OBSERVER (Remplace revealOnScroll) =====
function initIntersectionObserver() {
    if (state.observersInitialized) return;
    
    const observerOptions = {
        root: null,
        rootMargin: '0px 0px -25% 0px', // Trigger avant que l'élément soit complètement visible
        threshold: 0
    };

    const sectionObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting && !entry.target.classList.contains('visible')) {
                entry.target.classList.add('visible');
                
                // Anime les match fills une seule fois
                const matchFills = entry.target.querySelectorAll('.match-fill');
                matchFills.forEach(fill => {
                    if (fill.style.width === '0%' || !fill.style.width) {
                        setTimeout(() => {
                            const target = fill.getAttribute('data-target');
                            if (target) {
                                fill.style.width = target + '%';
                            }
                        }, 300);
                    }
                });
                
                // Unobserve après animation pour économiser les ressources
                sectionObserver.unobserve(entry.target);
            }
        });
    }, observerOptions);

    // Observer toutes les sections
    document.querySelectorAll('.section').forEach(section => {
        sectionObserver.observe(section);
    });

    state.observersInitialized = true;
}

// ===== SCROLL MANAGEMENT =====
const handleScrollanalysis = throttle(() => {
    // Marque qu'on est en train de scroller
    state.isScrolling = true;
    document.body.classList.add('is-scrolling');
    
    // Clear le timeout précédent
    clearTimeout(state.scrollTimeout);
    
    // Updates légers uniquement
    updateProgressBar();
    updateStickyCta();
    
    // Après 150ms sans scroll, on retire la classe
    state.scrollTimeout = setTimeout(() => {
        state.isScrolling = false;
        document.body.classList.remove('is-scrolling');
    }, 150);
}, 16); // ~60fps

// ===== TABS =====
function switchTab(index) {
    if (index < 0 || index >= state.totalTabs) return;
    
    state.currentTab = index;
    
    // Update buttons with completed state
    document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        btn.classList.remove('active', 'completed');
        
        if (i === index) {
            btn.classList.add('active');
        } else if (i < index) {
            btn.classList.add('completed');
        }
    });
    
    // Update content
    document.querySelectorAll('.tab-content').forEach((content, i) => {
        if (i === index) {
            content.classList.add('active');
        } else {
            content.classList.remove('active');
        }
    });
    
    vibrate(10);

    checkAllTabsViewed();
}



// ===== RÉVÉLATION RÉCAP TRANSFORMATIONS =====
function checkAllTabsViewed() {
    // Marque l'onglet actuel comme vu
    if (!state.viewedTabs) {
        state.viewedTabs = new Set();
    }
    state.viewedTabs.add(state.currentTab);
    
    // Si tous les 4 onglets ont été vus (0, 1, 2, 3)
    if (state.viewedTabs.size === 4) {
        const recapCard = document.getElementById('transformationsRecap');
        if (recapCard && !recapCard.classList.contains('revealed')) {
            // Petit délai pour que ce soit fluide
            setTimeout(() => {
                recapCard.classList.add('revealed');
                vibrate([10, 50, 10]); // Triple vibration pour signaler
            }, 300);
        }
    }
}

function handleTabsSwipe() {
    const swipeThreshold = 50;
    const diff = state.touchStartX - state.touchEndX;
    
    if (Math.abs(diff) > swipeThreshold) {
        if (diff > 0 && state.currentTab < state.totalTabs - 1) {
            switchTab(state.currentTab + 1);
        } else if (diff < 0 && state.currentTab > 0) {
            switchTab(state.currentTab - 1);
        }
    }
}

async function exportToPDF() {
    // Affiche un loader
    const loader = document.createElement('div');
    loader.innerHTML = `
        <div style="position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 99999; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 20px;">

            <div style="width: 60px; height: 60px; border: 4px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite;"></div>
            <div id="pdf-progress" style="color: white; font-size: 14px; opacity: 0.7;">Étape 1/8</div>
        </div>
        <style>
            @keyframes spin {
                to { transform: rotate(360deg); }
            }
        </style>
    `;
    document.body.appendChild(loader);

    const updateProgress = (step, total, text) => {
        const progressEl = document.getElementById('pdf-progress');
        if (progressEl) {
            progressEl.textContent = `${text} (${step}/${total})`;
        }
    };

    try {
        // Sauvegarde l'état actuel
        const savedState = {
            expandedVoies: [],
            openPitches: [],
            currentTab: state.currentTab,
            scrollPosition: window.scrollY
        };

        // Sauvegarde les voies ouvertes
        document.querySelectorAll('.voie-card.expanded').forEach(voie => {
            savedState.expandedVoies.push(voie.id);
        });

        // Sauvegarde les pitchs ouverts
        document.querySelectorAll('.atout-card.pitch-open').forEach(card => {
            const atoutNum = card.querySelector('.atout-pitch-toggle').getAttribute('data-atout');
            savedState.openPitches.push(atoutNum);
        });

        updateProgress(1, 8, 'Préparation du contenu');

        // === DÉPLIE TOUT POUR LE PDF ===
        
        // 1. Ouvre toutes les voies
        document.querySelectorAll('.voie-card').forEach(voie => {

        });

        // Attend que tout soit rendu
        await new Promise(resolve => setTimeout(resolve, 800));

        // === CONFIGURATION PDF ===
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({
            orientation: 'portrait',
            unit: 'mm',
            format: 'a4',
            compress: true
        });

        const pageWidth = pdf.internal.pageSize.getWidth();
        const pageHeight = pdf.internal.pageSize.getHeight();
        const margin = 10; // Marges réduites
        const contentWidth = pageWidth - (2 * margin);

        let pageCount = 1;

        // Fonction pour ajouter une image sur une ou plusieurs pages
        async function addImageToPDF(canvas, startY = margin) {
            const imgData = canvas.toDataURL('image/jpeg', 0.92);
            const imgWidth = contentWidth;
            const imgHeight = (canvas.height * contentWidth) / canvas.width;

            let remainingHeight = imgHeight;
            let sourceY = 0;
            let currentY = startY;

            while (remainingHeight > 0) {
                const availableHeight = pageHeight - currentY - margin;
                const heightToDraw = Math.min(remainingHeight, availableHeight);
                const sourceHeight = (heightToDraw * canvas.height) / imgHeight;

                // Crée un canvas temporaire pour la portion
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width;
                tempCanvas.height = sourceHeight;
                const tempCtx = tempCanvas.getContext('2d');
                
                tempCtx.drawImage(
                    canvas,
                    0, sourceY,
                    canvas.width, sourceHeight,
                    0, 0,
                    canvas.width, sourceHeight
                );

                const tempImgData = tempCanvas.toDataURL('image/jpeg', 0.92);
                pdf.addImage(tempImgData, 'JPEG', margin, currentY, imgWidth, heightToDraw);

                remainingHeight -= heightToDraw;
                sourceY += sourceHeight;

                if (remainingHeight > 0) {
                    pdf.addPage();
                    pageCount++;
                    currentY = margin;
                }
            }

            return currentY + (remainingHeight === 0 ? heightToDraw : 0);
        }

        // === 1. COVER PAGE CUSTOM ===
        updateProgress(2, 8, 'Page de couverture');
        
        // On crée une belle page de couverture propre
        pdf.setFillColor(97, 5, 69); // Couleur Tilto

        // Badge

        pdf.setTextColor(255, 255, 255);
        pdf.text('✨ TA STORY PRO', pageWidth / 2, 40, { align: 'center' });
        
        // Nom
        pdf.setFontSize(48);
        pdf.setFont('helvetica', 'bold');
        pdf.text('Nelly', pageWidth / 2, 100, { align: 'center' });
        
        // Citation
        pdf.setFontSize(14);
        pdf.setFont('helvetica', 'normal');
        const quote = '"Je me vois changer de métier, mais je veux rester dans un domaine';
        const quote2 = 'technique, utile et à taille humaine"';
        pdf.text(quote, pageWidth / 2, 130, { align: 'center' });
        pdf.text(quote2, pageWidth / 2, 140, { align: 'center' });
        
        // Date
        pdf.setFontSize(11);
        pdf.text('📅 Novembre 2025', pageWidth / 2, 170, { align: 'center' });

        pageCount++;

        const heroSection = document.getElementById('hero_start');

            const canvas = await html2canvas(heroSection, {
                scale: 2,
                useCORS: true,
                logging: false,
                backgroundColor: '#ffffff',
                width: 800,
                windowWidth: 800
            });
            await addImageToPDF(canvas);
            pdf.addPage();
            pageCount++;
        }

        // === 3. CITATION ===
        updateProgress(4, 8, 'Ta citation');
        const citationSection = document.getElementById('section-citation');
        if (citationSection) {
            const canvas = await html2canvas(citationSection, {
                scale: 2,
                useCORS: true,
                logging: false,
                backgroundColor: '#ffffff',
                width: 800,
                windowWidth: 800
            });
            await addImageToPDF(canvas);
            pdf.addPage();
            pageCount++;
        }

        // === 4. TRANSFORMATIONS (Tous les tabs) ===
        updateProgress(5, 8, 'Transformations');
        
        // Titre de section
        pdf.setFontSize(20);
        pdf.setTextColor(97, 5, 69);
        pdf.setFont('helvetica', 'bold');
        pdf.text('02  Ce qui te pèse → Ce dont tu as besoin', margin, margin + 10);
        
        let currentY = margin + 20;
        
        const tabs = document.querySelectorAll('.tab-content');
        for (let i = 0; i < tabs.length; i++) {
            const tab = tabs[i];
            
            pdf.setFontSize(14);
            pdf.setTextColor(97, 5, 69);
            pdf.text(`Transformation ${i + 1}/4`, margin, currentY);
            currentY += 10;
            
            const canvas = await html2canvas(tab, {
                scale: 2,
                useCORS: true,
                logging: false,
                backgroundColor: '#ffffff',
                width: 800,
                windowWidth: 800
            });
            
            currentY = await addImageToPDF(canvas, currentY);
            
            if (i < tabs.length - 1) {
                currentY += 10;
                if (currentY > pageHeight - 80) {
                    pdf.addPage();
                    pageCount++;
                    currentY = margin;
                }
            }
        }
        
        pdf.addPage();
        pageCount++;

        // === 5. ATOUTS ===

            });

                windowWidth: 800
            });

        }

        // === RESTAURE L'ÉTAT INITIAL ===
        
        // Ferme toutes les voies
        document.querySelectorAll('.voie-card').forEach(voie => {
            voie.classList.remove('expanded');
            const content = voie.querySelector('.voie-content');
            if (content) {
                content.style.maxHeight = '';
            }
        });

        // Réouvre celles qui étaient ouvertes
        savedState.expandedVoies.forEach(voieId => {
            const voie = document.getElementById(voieId);
            if (voie) voie.classList.add('expanded');
        });

        // Ferme tous les pitchs
        document.querySelectorAll('.atout-card').forEach(card => {
            card.classList.remove('pitch-open');
            const pitch = card.querySelector('.atout-pitch');
            if (pitch) pitch.style.maxHeight = '';
        });

        // Réouvre les pitchs qui étaient ouverts
        savedState.openPitches.forEach(atoutNum => {
            const card = document.querySelector(`.atout-pitch-toggle[data-atout="${atoutNum}"]`)?.closest('.atout-card');
            if (card) card.classList.add('pitch-open');
        });

        // Restaure le tab actif
        document.querySelectorAll('.tab-content').forEach((content, index) => {
            if (index === savedState.currentTab) {
                content.classList.add('active');
            } else {
                content.classList.remove('active');
            }
        });

        // Restaure la position de scroll
        window.scrollTo(0, savedState.scrollPosition);

        // === SAUVEGARDE ===
        pdf.save('Nelly-Analyse-Tilto-Complete.pdf');

        // Retire le loader
        document.body.removeChild(loader);

        // Ferme le modal
        closeModal('modalExport');

        // Message de succès
        showToast(`✅ PDF généré avec succès ! (${pageCount} pages)`);
        vibrate([10, 50, 10]);

    } catch (error) {
        console.error('Erreur PDF:', error);
        if (document.body.contains(loader)) {
            document.body.removeChild(loader);
        }
        alert('❌ Erreur lors de la génération du PDF. Réessaie ou utilise "Imprimer > Enregistrer en PDF".');
    }
}

async function getShareableLink() {

                       || document.querySelector('input[name="csrf_token"]')?.value
                       || '';
        
        const response = await fetch('/analysis/share/create', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken
            },
            body: JSON.stringify({
                quiz_id: '{{ quiz_id }}',
                result_id: null
            })
        });
        
        const data = await response.json();
        
        if (data.success) {
            return data.share_url;
        } else {
            console.error('Erreur création lien:', data.error);
            return null;
        }
    } catch (error) {
        console.error('Erreur fetch:', error);
        return null;
    }
}

            'J\'ai fait une analyse de mes options de reconversion.\n' +
            'J\'aimerais avoir ton avis !\n\n' +
            'Voici le lien : ' + shareUrl + '\n\n' +
            '(Valable 7 jours)\n\n' +
            'Merci ! 🙏'
        );
        
        window.location.href = `mailto:?subject=${subject}&body=${body}`;
        closeModal('modalExport');
        // Pas de toast - l'app email s'ouvre, c'est évident
    } else {
        showToast('❌ Oups, réessaie');
    }
}

async function copyLink() {
    showToast('⏳ Préparation...');
    
    const shareUrl = await getShareableLink();
    
    if (shareUrl) {
        try {
            await navigator.clipboard.writeText(shareUrl);
            showToast('✅ Lien copié !'); // Toast nécessaire ici - action invisible
            vibrate(10);
        } catch {
            // Fallback
            const textArea = document.createElement('textarea');
            textArea.value = shareUrl;
            textArea.style.cssText = 'position:fixed;opacity:0';
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            showToast('✅ Lien copié !');
            vibrate(10);
        }
    } else {
        showToast('❌ Oups, réessaie');
    }
}

function fallbackCopyLink(url) {
    const textArea = document.createElement('textarea');
    textArea.value = url;
    textArea.style.position = 'fixed';
    textArea.style.opacity = '0';
    document.body.appendChild(textArea);
    textArea.select();
    
    try {
        document.execCommand('copy');
        showToast('✅ Lien copié !');
        vibrate(10);
    } catch (err) {
        showToast('❌ Impossible de copier');
    }
    
    document.body.removeChild(textArea);
}

        modal.addEventListener('click', (e) => {

    // ===== VOIES NAVIGATION EVENT LISTENERS =====

// Cartes de destination des voies
document.querySelectorAll('.voie-destination').forEach(card => {
    card.addEventListener('click', function() {
        const voieNumber = parseInt(this.dataset.voie);
        goToVoieDetail(voieNumber);
    });
});

// Boutons de fermeture des voies
document.querySelectorAll('.voie-close-btn').forEach(btn => {
    btn.addEventListener('click', function(e) {
        e.stopPropagation(); // Évite la propagation
        backToOptions();
    });
});

// Boutons Next/Retour des voies
document.querySelectorAll('.voie-next-btn').forEach(btn => {
    btn.addEventListener('click', function(e) {
        e.stopPropagation();
        const currentVoie = parseInt(this.dataset.voie);
        const isLast = this.dataset.isLast === 'true';
        
        if (isLast) {
            backToOptions();
        } else {
            goToVoieDetail(currentVoie + 1);
        }
    });
});

    // Export buttons
    const exportPdfBtn = document.getElementById('exportPdfBtn');
    const shareWhatsappBtn = document.getElementById('shareWhatsappBtn');
    const shareEmailBtn = document.getElementById('shareEmailBtn');
    const finalExportPdfBtn = document.getElementById('finalExportPdfBtn');
    const finalShareWhatsappBtn = document.getElementById('finalShareWhatsappBtn');
    const finalShareEmailBtn = document.getElementById('finalShareEmailBtn');
    
    if (exportPdfBtn) exportPdfBtn.addEventListener('click', exportToPDF);
    if (shareWhatsappBtn) shareWhatsappBtn.addEventListener('click', shareWhatsApp);
    if (shareEmailBtn) shareEmailBtn.addEventListener('click', shareEmail);
    if (finalExportPdfBtn) finalExportPdfBtn.addEventListener('click', exportToPDF);
    if (finalShareWhatsappBtn) finalShareWhatsappBtn.addEventListener('click', shareWhatsApp);
    if (finalShareEmailBtn) finalShareEmailBtn.addEventListener('click', shareEmail);
    
    // Voie cards
    document.querySelectorAll('.voie-header').forEach(header => {
        header.addEventListener('click', (e) => {
            if (e.target.closest('.action-item')) {
                return;
            }
            toggleVoie(header);
        });
    });
    
    // Action items
    document.querySelectorAll('.action-item').forEach(item => {
        item.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleAction(item);
        });
    });
    
    // Atout pitch toggles
    document.querySelectorAll('.atout-pitch-toggle').forEach(toggle => {
        toggle.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleAtoutPitch(toggle);
        });
    });
    
    // Tabs event listeners
    document.querySelectorAll('.tab-btn').forEach((btn, index) => {
        btn.addEventListener('click', () => {
            switchTab(index);
        });
    });
    
    // Touch swipe for tabs (mobile)
    const tabsWrapper = document.querySelector('.tabs-content-wrapper');
    if (tabsWrapper) {
        tabsWrapper.addEventListener('touchstart', (e) => {
            state.touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });
        
        tabsWrapper.addEventListener('touchend', (e) => {
            state.touchEndX = e.changedTouches[0].screenX;
            handleTabsSwipe();
        }, { passive: true });
    }
    
    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
        // Navigation tabs
        if (e.target.closest('.transformations-tabs-container')) {
            if (e.key === 'ArrowLeft') {
                switchTab(Math.max(0, state.currentTab - 1));
            } else if (e.key === 'ArrowRight') {
                switchTab(Math.min(state.totalTabs - 1, state.currentTab + 1));
            }
        }
        
        // Close modals
        if (e.key === 'Escape') {
            const openModals = document.querySelectorAll('.modal.open');
            openModals.forEach(modal => {
                closeModal(modal.id);
            });
        }
    });
    
    // ===== SWIPE SUPPORT FOR VOIES (IMPROVED) =====
    let voieTouchStartX = 0;
    let voieTouchEndX = 0;
    let voieTouchStartY = 0;
    let voieTouchEndY = 0;
    
    document.querySelectorAll('.voie-detail-section').forEach(section => {
        section.addEventListener('touchstart', (e) => {
            voieTouchStartX = e.changedTouches[0].screenX;
            voieTouchStartY = e.changedTouches[0].screenY;
        }, { passive: true });
        
        section.addEventListener('touchend', (e) => {
            voieTouchEndX = e.changedTouches[0].screenX;
            voieTouchEndY = e.changedTouches[0].screenY;
            handleVoieSwipe();
        }, { passive: true });
    });
    
    function handleVoieSwipe() {
        const swipeThreshold = 75; // Augmenté pour éviter les faux swipes
        const diffX = voieTouchStartX - voieTouchEndX;
        const diffY = Math.abs(voieTouchStartY - voieTouchEndY);
        
        // Vérifie que c'est un swipe horizontal (et pas vertical scroll)
        if (diffY > 50) return;
        
        // Swipe left (next)
        if (diffX > swipeThreshold && currentVoie < 3) {
            goToVoieDetail(currentVoie + 1);
            vibrate(10); // Feedback tactile
        }
        
        // Swipe right (previous or back to options)
        if (diffX < -swipeThreshold) {
            if (currentVoie > 1) {
                goToVoieDetail(currentVoie - 1);
                vibrate(10);
            } else if (currentVoie === 1) {
                backToOptions();
                vibrate(10);
            }
        }
    }
    
    console.log('✅ All event listeners attached');
});

            lastScrollTime = now;
        }
    });
}
