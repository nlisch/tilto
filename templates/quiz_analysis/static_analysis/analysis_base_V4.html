{% extends "base.html" %}

{% block extra_css %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

/* ============================================================
   ANALYSIS V4 - Styles spécifiques
   Base layout (body, header, footer, nav) hérité de base.html
   ============================================================ */

:root {
    --v4-primary: #A11857;
    --v4-primary-light: #FDF2F8;
    --v4-text: #1A1A1A;
    --v4-text-medium: #4A4A4A;
    --v4-text-muted: #999999;
    --v4-white: #FFFFFF;
    --v4-cream: #FAF7F2;
    --v4-rose-pale: #EBD5E3;
    --v4-rose-light: #FDF2F8;
    --v4-border: #EBD5E3;
}

/* ── Page-level overrides ── */
.analysis-mvp-page {
    background-color: var(--v4-primary);
    color: var(--v4-text);
    line-height: 1.5;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
    font-family: 'Open Sans', -apple-system, sans-serif;
}

.analysis-mvp-page html,
.analysis-mvp-page body {
    height: 100%;
    overflow: hidden;
}

/* ── Main container V4 ── */
.v4-container {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    background: var(--v4-white);
    border-radius: 24px;
    overflow: visible;
    box-shadow: 0 25px 80px rgba(0, 0, 0, 0.3);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    margin-bottom:2rem;
    margin-top:5.5rem;
}

/* ── V4 Header ── */
.v4-header {
    background: var(--v4-cream);
    padding: 14px 24px;
    color: var(--v4-text);
    position: sticky;
    top: 0;
    z-index: 100;
    flex-shrink: 0;
    border-bottom: 2px solid var(--v4-primary);
    border-radius: 10px;
}

.v4-header-content {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 0;
}

.v4-header-icon {
    width: auto;
    height: auto;
    background: none;
    border-radius: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
}

.v4-header-title {
    flex: 1;
}

.v4-header h1 {
    font-family: 'Caveat', cursive;
    font-size: 1.3rem;
    font-weight: 600;
    color: var(--v4-primary);
    margin-bottom: 1rem;
}

.v4-subtitle {
    font-size: 0.85rem;
    color: var(--v4-text-medium);
    opacity: 1;
    font-weight: 400;
}

/* ── Main content area ── */
.v4-main-content {
    flex: 1;
    overflow: visible;
    position: relative;
}

/* ── Sections (panels) ── */
.v4-section {
    display: none;
    background-color: var(--v4-white);
    padding: 0;
    opacity: 0;
    transition: opacity 0.4s ease;
}

.v4-section.active {
    display: block;
    opacity: 1;
}

/* ── Module layout ── */
.v4-module-container {
    padding: 10px 28px 28px 28px;
    max-width: 900px;
    margin: 0 auto;
    width: 100%;
}

.v4-module {
    margin-bottom: 28px;
    border-radius: 0;
    background-color: var(--v4-white);
    box-shadow: none;
    overflow: hidden;
}

.v4-module-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px 0 16px 0;
    border-bottom: 1px solid var(--v4-border);
}

.v4-module-header_piste {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px 0 16px 0;
    border-bottom: none;
}

.v4-module-icon {
    width: 40px;
    height: 40px;
    background: var(--v4-rose-light);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--v4-primary);
    font-size: 1.2rem;
    flex-shrink: 0;
}

.v4-module-title {
    font-family: 'Libre Baskerville', serif;
    font-size: 1.15rem;
    color: var(--v4-text);
    margin-bottom: 0;
    font-weight: 700;
}

.v4-module-content {
    padding: 20px 0;
}

/* ── Typography inside V4 ── */
.v4-container h3 {
    font-family: 'Libre Baskerville', serif;
    font-size: 1rem;
    color: var(--v4-text);
    margin: 24px 0 12px 0;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--v4-border);
    font-weight: 700;
}

.v4-container h3.first {
    margin-top: 0;
}

.v4-container p {
    margin-bottom: 14px;
    font-size: 0.92rem;
    color: var(--v4-text-medium);
    line-height: 1.65;
}

.v4-container ul {
    margin-bottom: 14px;
    padding-left: 20px;
}

.v4-container li {
    margin-bottom: 8px;
    font-size: 0.92rem;
    color: var(--v4-text-medium);
    line-height: 1.55;
}

/* ── Dimension highlight ── */
.v4-dimension-highlight {
    margin: 20px 0;
    padding: 18px 22px;
    border-radius: 16px;
    position: relative;
}

.v4-highlight-how {
    background-color: var(--v4-rose-light);
    border-left: 4px solid var(--v4-primary);
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--pink);
    margin-bottom: 0.75rem;
}

.v4-dimension-title {
    font-weight: 700;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.92rem;
}

.v4-how-title { color: var(--v4-primary);
    font-size: 1.2rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 0.75rem; }

/* ── Citation block ── */
.v4-citation {
    background: var(--v4-cream);
    padding: 28px;
    border-radius: 20px;
    margin: 20px 0;
    position: relative;
    font-style: italic;
}

.v4-citation::before {
    content: '«';
    position: absolute;
    left: 18px;
    top: 8px;
    font-family: 'Libre Baskerville', serif;
    font-size: 3rem;
    opacity: 0.15;
    color: var(--v4-primary);
    font-style: normal;
}

.v4-citation p {
    margin: 0 0 0 24px;
    color: var(--v4-text-medium);
    padding-right: 20px;
    font-family: 'Libre Baskerville', serif;
    font-size: 0.95rem;
    line-height: 1.9;
}

.v4-citation::after {
    content: '»';
    position: absolute;
    right: 18px;
    bottom: 8px;
    font-family: 'Libre Baskerville', serif;
    font-size: 3rem;
    opacity: 0.15;
    color: var(--v4-primary);
    font-style: normal;
}

/* ── Welcome screen ── */
.v4-welcome-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    text-align: center;
    height: 100%;
    padding: 16px 24px 24px;
    overflow-y: auto;
}

.v4-welcome-video-placeholder {
    width: 100%;
    max-width: 440px;
    aspect-ratio: 16 / 7;
    background: var(--v4-cream);
    border: 2px dashed var(--v4-rose-pale);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
    gap: 4px;
    flex-shrink: 0;
    display:none;
}

.v4-welcome-video-placeholder span {
    font-size: 1.6rem;
    color: var(--v4-primary);
    opacity: 0.5;
}

.v4-welcome-video-placeholder p {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--v4-text-muted);
    margin: 0;
}

.v4-welcome-title {
    font-family: 'Libre Baskerville', serif;
    font-size: 1.3rem;
    color: var(--v4-text);
    margin-bottom: 12px;
    font-weight: 700;
    line-height: 1.35;
    margin-top: 3rem;
    margin-bottom: 3rem;
}

.v4-welcome-subtitle {
    font-size: 0.9rem;
    color: var(--v4-text-medium);
    margin-bottom: 16px;
    max-width: 900px;
    line-height: 1.6;
}

#pistes-continue-block {
    display:none;
}

.v4-welcome-quote {
    width: 100%;
    max-width: 900px;
    background: var(--v4-cream);
    border-radius: 14px;
    padding: 18px 22px;
    margin-bottom: 16px;
    text-align: left;
    position: relative;
}

.v4-welcome-quote p {
    font-family: 'Libre Baskerville', serif;
    font-size: 0.85rem;
    font-style: italic;
    color: var(--v4-text-medium);
    line-height: 1.7;
    margin: 0 0 10px 0;
}

.v4-welcome-quote-signature {
    font-family: 'Caveat', 'Segoe Script', cursive;
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--v4-primary);
}

.v4-welcome-section-title {
    font-family: 'Libre Baskerville', serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--v4-text);
    margin: 0 0 10px 0;
    padding-bottom: 0;
    border-bottom: none;
    text-align: center;
}

/* ── Comprends block ── */
.v4-comprends-block {
    width: calc(100% + 48px);
    margin-left: -24px;
    margin-right: -24px;
    background: var(--v4-rose-light);
    border-radius: 0;
    padding: 28px 24px;
    margin-bottom: 16px;
    text-align: center;
    max-width: 900px;
    border-radius: 14px;
}

.v4-comprends-label {
    font-size: 0.9rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--v4-primary);
    margin-bottom: 14px;
}

.v4-comprends-text {
    font-family: 'Libre Baskerville', serif;
    font-size: 1.35rem;
    font-weight: 700;
    line-height: 1.4;
    color: var(--v4-text);
    margin: 0 auto;
    max-width: 580px;
}

.v4-comprends-text em {
    font-style: italic;
    color: var(--v4-primary);
}

/* ── Welcome options ── */
.v4-welcome-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5rem;
    width: 100%;
    max-width: 900px;
    margin-bottom: 12px;
}

.v4-welcome-option {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--v4-white);
    border: 2px solid var(--v4-rose-pale);
    border-radius: 10px;
    padding: 10px 14px;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: left;
    font-size: 0.85rem;
    color: var(--v4-text);
    font-weight: 500;
}

.v4-welcome-option:hover {
    border-color: var(--v4-primary);
    transform: translateY(-1px);
    box-shadow: 0 4px 15px rgba(161, 24, 87, 0.1);
}

.v4-welcome-option input[type="radio"] {
    appearance: none;
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border: 2px solid var(--v4-rose-pale);
    border-radius: 50%;
    flex-shrink: 0;
    position: relative;
    cursor: pointer;
    transition: all 0.2s;
}

.v4-welcome-option input[type="radio"]:checked {
    border-color: var(--v4-primary);
    background: var(--v4-primary);
}

.v4-welcome-option input[type="radio"]:checked::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 6px;
    height: 6px;
    background: white;
    border-radius: 50%;
}

.v4-welcome-option:has(input:checked) {
    border-color: var(--v4-primary);
    background: var(--v4-rose-light);
}

/* ── Feedback textarea ── */
.v4-welcome-feedback {
    width: 100%;
    max-width: 900px;
    border: 2px solid var(--v4-rose-pale);
    border-radius: 10px;
    padding: 10px 14px;
    font-family: 'Open Sans', sans-serif;
    font-size: 0.85rem;
    color: var(--v4-text);
    resize: vertical;
    margin-bottom: 14px;
    transition: border-color 0.2s;
    line-height: 1.6;
    background: var(--v4-white);
    min-height: 100px;
}

.v4-welcome-feedback::placeholder {
    color: var(--v4-text-muted);
    font-style: italic;
}

.v4-welcome-feedback:focus {
    outline: none;
    border-color: var(--v4-primary);
    box-shadow: 0 0 0 3px rgba(161, 24, 87, 0.1);
}

/* ── Navigation (step tabs) ── */
.v4-main-navigation {
    background: var(--v4-cream);
    border-bottom: none;
    padding: 10px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    margin-bottom: 0;
    box-shadow: none;
    border-top: 1px solid var(--v4-border);
    overflow-x: hidden;
}

.v4-nav-container {
    display: flex;
    justify-content: center;
    align-items: center;
    max-width: 100%;
    margin: 0 auto;
    width: 100%;
    overflow-x: auto;
}

.v4-nav-steps {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    justify-content: space-between;
    flex-wrap: nowrap;
}

.v4-nav-step {
    display: flex;
    align-items: center;
    cursor: pointer;
    transition: all 0.2s ease;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 0.78rem;
    font-weight: 600;
    position: relative;
    color: var(--v4-text-muted);
    background: var(--v4-white);
    border: 2px solid var(--v4-rose-pale);
    min-width: fit-content;
    white-space: nowrap;
    flex: 1;
    max-width: calc(25% - 6px);
}

.v4-nav-separator {
    width: 12px;
    height: 2px;
    background: var(--v4-rose-pale);
    border-radius: 1px;
    margin: 0 2px;
    transition: all 0.3s ease;
    flex-shrink: 0;
}

.v4-nav-step-number {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--v4-rose-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    font-weight: 700;
    margin-right: 6px;
    border: 2px solid var(--v4-rose-pale);
    transition: all 0.2s ease;
    flex-shrink: 0;
    color: var(--v4-text-muted);
}

.v4-nav-step:hover {
    border-color: var(--v4-primary);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(161, 24, 87, 0.1);
    color: var(--v4-text);
}

.v4-nav-step.active {
    background: var(--v4-rose-light);
    color: var(--v4-primary);
    border-color: var(--v4-primary);
    box-shadow: 0 4px 15px rgba(161, 24, 87, 0.15);
    font-weight: 700;
}

.v4-nav-step.completed {
    background: var(--v4-white);
    color: var(--v4-text-medium);
    border-color: var(--v4-primary);
}

.v4-nav-step.active .v4-nav-step-number,
.v4-nav-step.completed .v4-nav-step-number {
    background: var(--v4-primary);
    color: white;
    border-color: var(--v4-primary);
}

.v4-nav-step:hover .v4-nav-step-number {
    border-color: var(--v4-primary);
}

.v4-nav-separator.completed {
    background: var(--v4-primary);
}

.v4-nav-step:not(.active):not(.completed) {
    cursor: default;
    pointer-events: none;
    opacity: 0.6;
}

/* ── Start button ── */
.v4-start-button {
    padding: 14px 32px;
    background-color: var(--v4-primary);
    color: white;
    border: none;
    border-radius: 12px;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 15px rgba(161, 24, 87, 0.3);
}

.v4-start-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(161, 24, 87, 0.4);
}

/* ── Transformation Carousel ── */
.v4-transformation-carousel {
    margin: 20px 0;
    background: var(--v4-white);
    border-radius: 16px;
    border: 1px solid var(--v4-rose-pale);
    overflow: hidden;
}

.v4-carousel-header {
    background: var(--v4-cream);
    padding: 16px 20px;
    text-align: center;
    border-bottom: 1px solid var(--v4-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.v4-carousel-header h4 {
    margin: 0;
    color: var(--v4-primary);
    font-family: 'Libre Baskerville', serif;
    font-size: 1rem;
    flex: 1;
    font-weight: 700;
}

.v4-carousel-indicators {
    display: flex;
    justify-content: center;
    gap: 8px;
}

.v4-indicator {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ddd;
    cursor: pointer;
    transition: all 0.3s ease;
}

.v4-indicator.active {
    background: var(--v4-primary);
    transform: scale(1.2);
}

.v4-carousel-container {
    position: relative;
    overflow: hidden;
    min-height: 180px;
}

.v4-carousel-slide {
    display: none;
    padding: 24px;
    animation: v4FadeIn 0.4s ease;
}

.v4-carousel-slide.active {
    display: block;
}

.v4-transformation-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    text-align: center;
}

.v4-before-quote, .v4-after-quote {
    flex: 1;
    padding: 18px;
    border-radius: 14px;
    min-height: 70px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.v4-before-quote {
    background: var(--v4-cream);
    border-left: 4px solid var(--v4-rose-pale);
}

.v4-after-quote {
    background: var(--v4-rose-light);
    border-left: 4px solid var(--v4-primary);
}

.v4-quote-label {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 8px;
    letter-spacing: 1.5px;
}

.v4-before-quote .v4-quote-label { color: var(--v4-text-muted); }
.v4-after-quote .v4-quote-label { color: var(--v4-primary); }

.v4-transformation-card p {
    margin: 0;
    font-family: 'Libre Baskerville', serif;
    font-style: italic;
    font-size: 0.9rem;
    line-height: 1.5;
    color: var(--v4-text-medium);
}

.v4-transformation-arrow {
    font-size: 1.5rem;
    color: var(--v4-primary);
    font-weight: bold;
}

.v4-carousel-controls {
    display: flex;
    justify-content: space-between;
    padding: 14px 24px;
    background: var(--v4-cream);
}

.v4-carousel-btn {
    background: var(--v4-primary);
    color: white;
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    font-size: 1.3rem;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
}

.v4-carousel-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(161, 24, 87, 0.3);
}

@keyframes v4FadeIn {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
}

/* ── Transformation insight ── */
.v4-transformation-insight {
    background-color: var(--v4-cream);
    border: 1px solid var(--v4-rose-pale);
    border-radius: 16px;
    padding: 24px;
    margin: 20px 0;
    position: relative;
    text-align: center;
    background-color: #FAF7F2;
    border: 1px solid #92600a;
}

.v4-insight-badge {
    font-size: 0.7rem;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 20px;
    position: absolute;
    top: -10px;
    left: 20px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    background: #FEF3C7;
    color: #92600a;
    border: 1px solid #92600a;
}

.v4-transformation-insight p {
    margin: 8px 0 0 0;
    font-size: 0.92rem;
    color: var(--v4-text-medium);
    line-height: 1.55;
}

/* ── Stat tags & cards ── */
.v4-stat-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
}

.v4-stat-tag {
    background: var(--v4-cream);
    border: 1px solid var(--v4-rose-pale);
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--v4-text);
}

.v4-stat-cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
}

.v4-stat-card {
    background: var(--v4-rose-light);
    border-radius: 14px;
    padding: 18px 14px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.v4-stat-card-value {
    font-family: 'Libre Baskerville', serif;
    font-size: 1rem;
    font-weight: 700;
    color: var(--v4-primary);
    margin-bottom: 4px;
}

.v4-stat-card-label {
    font-size: 0.75rem;
    color: var(--v4-text-muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

/* ── Section2 feedback ── */
.v4-section2-feedback {
    margin-top: 24px;
    padding: 24px;
    background: var(--v4-rose-light);
    border-radius: 14px;
    text-align: center;
}

.v4-section2-feedback-label {
    font-family: 'Libre Baskerville', serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--v4-text);
    margin-bottom: 16px;
}

.v4-section2-feedback .v4-welcome-options {
    max-width: 100%;
    grid-template-columns: 1fr 1fr;
}

.v4-section2-feedback .v4-welcome-option {
    background: var(--v4-primary);
    color: var(--v4-white);
    border: none;
    justify-content: center;
    font-weight: 700;
    padding: 14px 18px;
    transition: all 0.2s;
}


.v4-section2-feedback .v4-welcome-option:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(161, 24, 87, 0.3);
    border: none;
}

.v4-section2-feedback .v4-welcome-option input[type="radio"] {
    display: none;
}

.v4-section2-feedback .v4-welcome-option:has(input:checked) {
    background: #7B1046;
    border: 3px solid var(--v4-white);
    outline: 3px solid var(--v4-primary);
    transform: scale(1.03);
    box-shadow: 0 6px 20px rgba(161, 24, 87, 0.35);
}

/* ── Pistes list ── */
.v4-pistes-list {
    list-style: none;
    padding: 22px 24px;
    margin: 0 0 24px 0;
    background: #ECFDF5;
    border-radius: 14px;
}

.v4-pistes-list li {
    font-size: 0.92rem;
    color: var(--v4-text-medium);
    line-height: 1.55;
    padding: 10px 0 10px 28px;
    position: relative;
    margin-bottom: 0;
}

.v4-pistes-list li::before {
    content: '✓';
    position: absolute;
    left: 0;
    color: #059669;
    font-weight: 700;
    font-size: 1.1rem;
}

.v4-pistes-list li strong {
    color: var(--v4-text);
}

/* ── Section4 choix ── */
.v4-section4-choix {
    margin-top: 24px;
    text-align: center;
}

.v4-section4-choix-intro {
    font-family: 'Libre Baskerville', serif;
    font-size: 1.1rem;
    color: var(--v4-text);
    line-height: 1.7;
    margin-bottom: 28px;
    max-width: 560px;
    margin-left: auto;
    margin-right: auto;
    font-weight: 400;
}

.v4-section4-buttons {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 500px;
    margin: 0 auto;
}

.v4-section4-btn {
    display: block;
    width: 100%;
    padding: 16px 24px;
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    border: none;
    text-align: center;
}

.v4-section4-btn-primary {
    background: var(--v4-primary);
    color: var(--v4-white);
    box-shadow: 0 4px 15px rgba(161, 24, 87, 0.3);
}

.v4-section4-btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(161, 24, 87, 0.4);
}

.v4-section4-btn-secondary {
    background: var(--v4-white);
    color: var(--v4-primary);
    border: 2px solid var(--v4-primary);
}

.v4-section4-btn-secondary:hover {
    background: var(--v4-rose-light);
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(161, 24, 87, 0.1);
}

.v4-section4-btn-tertiary {
    background: none;
    color: var(--v4-text-muted);
    font-weight: 600;
    padding: 12px 24px;
}

.v4-section4-btn-tertiary:hover {
    color: var(--v4-text);
    background: var(--v4-cream);
}

/* ── Carnet section ── */
.v4-carnet-section {
    display: flex;
    flex-direction: column;
    gap: 0;
    margin-bottom: 20px;
}

.v4-carnet-item {
    padding: 16px 0;
    border-bottom: 1px solid var(--v4-border);
}

.v4-carnet-item:last-child { border-bottom: none; }

.v4-carnet-item-title {
    font-family: 'Libre Baskerville', serif;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--v4-text);
    margin-bottom: 8px;
}

.v4-carnet-item-list {
    list-style: none;
    padding: 0;
    margin: 0;
}

.v4-carnet-item-list li {
    font-size: 0.88rem;
    color: var(--v4-text-medium);
    line-height: 1.55;
    padding: 4px 0 4px 20px;
    position: relative;
    margin-bottom: 0;
}

.v4-carnet-item-list li::before {
    content: '–';
    position: absolute;
    left: 0;
    color: var(--v4-primary);
    font-weight: 700;
}

.v4-carnet-conclusion {
    background: var(--v4-cream);
    border-radius: 14px;
    padding: 20px 22px;
    margin-bottom: 24px;
}

.v4-carnet-conclusion p {
    margin: 0;
    font-size: 0.95rem;
    color: var(--v4-text);
    line-height: 1.65;
}

/* ── Section5 CTA ── */
.v4-section5-cta {
    text-align: center;
    margin-bottom: 32px;
}

/* ── Coach block ── */
.v4-coach-block {
    background: var(--v4-cream);
    border-radius: 16px;
    padding: 24px;
}

.v4-coach-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
}

.v4-coach-avatar {
    width: 48px;
    height: 48px;
    background: var(--v4-primary);
    color: var(--v4-white);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Caveat', cursive;
    font-size: 1.5rem;
    font-weight: 700;
    flex-shrink: 0;
}

.v4-coach-name {
    font-family: 'Libre Baskerville', serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--v4-text);
}

.v4-coach-text p {
    font-size: 0.9rem;
    color: var(--v4-text-medium);
    line-height: 1.7;
    margin-bottom: 12px;
}

.v4-coach-text p:last-child { margin-bottom: 0; }

/* ── Pricing grid ── */
.v4-pricing-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin: 24px 0;
}

.v4-pricing-card {
    background: var(--v4-white);
    border: 2px solid var(--v4-border);
    border-radius: 16px;
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
}

.v4-pricing-card-name {
    font-family: 'Libre Baskerville', serif;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--v4-text);
    margin-bottom: 4px;
}

.v4-pricing-card-coach {
    font-size: 0.82rem;
    color: var(--v4-text-muted);
    margin-bottom: 12px;
}

.v4-pricing-card-for {
    font-size: 0.85rem;
    color: var(--v4-primary);
    font-weight: 600;
    margin-bottom: 16px;
    line-height: 1.5;
}

.v4-pricing-card-price {
    font-family: 'Libre Baskerville', serif;
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--v4-text);
    margin-bottom: 4px;
}

.v4-pricing-card-duration {
    font-size: 0.8rem;
    color: var(--v4-text-muted);
    margin-bottom: 16px;
}

.v4-pricing-card-includes {
    list-style: none;
    padding: 0;
    margin: 0 0 20px 0;
    flex-grow: 1;
}

.v4-pricing-card-includes li {
    font-size: 0.85rem;
    color: var(--v4-text-medium);
    line-height: 1.5;
    padding: 6px 0 6px 24px;
    position: relative;
    margin-bottom: 0;
}

.v4-pricing-card-includes li::before {
    content: '✓';
    position: absolute;
    left: 0;
    color: var(--v4-primary);
    font-weight: 700;
}

.v4-pricing-card-ideal {
    font-size: 0.82rem;
    color: var(--v4-text-muted);
    font-style: italic;
    margin-bottom: 16px;
    line-height: 1.5;
}

.v4-pricing-card-btn {
    display: block;
    width: 100%;
    padding: 14px;
    background: var(--v4-primary);
    color: var(--v4-white);
    border: none;
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    margin-bottom: 10px;
    transition: all 0.2s;
}

.v4-pricing-card-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(161, 24, 87, 0.3);
}

/* ── Pricing accordion ── */
.v4-pricing-accordion { width: 100%; }

.v4-pricing-accordion-toggle {
    background: none;
    border: none;
    color: var(--v4-primary);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    padding: 8px 0;
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    justify-content: center;
}

.v4-pricing-accordion-toggle .arrow {
    transition: transform 0.2s;
    font-size: 0.7rem;
}

.v4-pricing-accordion-toggle.open .arrow {
    transform: rotate(180deg);
}

.v4-pricing-accordion-content {
    display: none;
    padding-top: 12px;
    text-align: left;
}

.v4-pricing-accordion-content.open { display: block; }

.v4-pricing-accordion-content h4 {
    font-family: 'Libre Baskerville', serif;
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--v4-text);
    margin: 16px 0 8px 0;
}

.v4-pricing-accordion-content h4:first-child { margin-top: 0; }

.v4-pricing-accordion-content p {
    font-size: 0.85rem;
    color: var(--v4-text-medium);
    line-height: 1.6;
    margin-bottom: 10px;
}

.v4-pricing-accordion-content ul {
    list-style: none;
    padding: 0;
    margin: 0 0 10px 0;
}

.v4-pricing-accordion-content ul li {
    font-size: 0.85rem;
    color: var(--v4-text-medium);
    line-height: 1.5;
    padding: 3px 0 3px 20px;
    position: relative;
    margin-bottom: 0;
}

.v4-pricing-accordion-content ul li::before {
    content: '–';
    position: absolute;
    left: 0;
    color: var(--v4-primary);
    font-weight: 700;
}

/* ── Coach expandable ── */
.v4-coach-expandable-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 8px;
}

.v4-coach-expandable-photo {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
}

.v4-coach-expandable-toggle {
    background: none;
    border: 1px solid var(--v4-rose-pale);
    border-radius: 10px;
    color: var(--v4-primary);
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    padding: 8px 14px;
    transition: all 0.2s;
}

.v4-coach-expandable-toggle:hover { background: var(--v4-rose-light); }

.v4-coach-expandable-content { display: none; margin-top: 12px; }
.v4-coach-expandable-content.open { display: block; }

/* ── Booking ── */
.v4-booking-slots { margin: 24px 0; }

.v4-booking-slots-label {
    font-family: 'Libre Baskerville', serif;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--v4-text);
    margin-bottom: 12px;
}

.v4-booking-slots-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

.v4-booking-slot {
    display: block;
    text-align: center;
    padding: 12px 8px;
    border: 2px solid var(--v4-border);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.82rem;
    color: var(--v4-text-medium);
    line-height: 1.4;
}

.v4-booking-slot input { display: none; }

.v4-booking-slot:hover {
    border-color: var(--v4-primary);
    background: var(--v4-rose-light);
}

.v4-booking-slot:has(input:checked) {
    border-color: var(--v4-primary);
    background: var(--v4-primary);
    color: var(--v4-white);
}

.v4-booking-slot:has(input:checked) strong { color: var(--v4-white); }
.v4-booking-slot strong { color: var(--v4-text); font-size: 0.95rem; }

.v4-booking-form-block {
    background: var(--v4-cream);
    border-radius: 14px;
    padding: 24px;
    margin-top: 24px;
}

.v4-booking-field { margin-bottom: 16px; }

.v4-booking-field label {
    display: block;
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--v4-text);
    margin-bottom: 6px;
}

.v4-booking-field input[type="text"],
.v4-booking-field input[type="email"] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--v4-border);
    border-radius: 10px;
    font-size: 0.9rem;
    font-family: inherit;
    box-sizing: border-box;
    background: var(--v4-white);
}

.v4-booking-field input:focus,
.v4-booking-field textarea:focus {
    outline: none;
    border-color: var(--v4-primary);
}

.v4-booking-field textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--v4-border);
    border-radius: 10px;
    font-size: 0.88rem;
    font-family: inherit;
    resize: vertical;
    min-height: 60px;
    box-sizing: border-box;
    background: var(--v4-white);
}

.v4-booking-budget-options {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.v4-booking-budget-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--v4-white);
    border: 1px solid var(--v4-border);
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.88rem;
    color: var(--v4-text-medium);
    transition: all 0.2s;
}

.v4-booking-budget-option:hover { border-color: var(--v4-primary); }

.v4-booking-budget-option:has(input:checked) {
    border-color: var(--v4-primary);
    background: var(--v4-rose-light);
}

.v4-booking-budget-option input { accent-color: var(--v4-primary); }

/* ── Options carousel ── */
.v4-options-carousel {
    margin: 20px 0;
    background: var(--v4-white);
    border-radius: 16px;
    border: 1px solid var(--v4-rose-pale);
    overflow: hidden;
}

.v4-option-slide { padding: 24px 20px; }

.v4-option-title {
    font-family: 'Libre Baskerville', serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--v4-text);
    margin-bottom: 14px;
    text-align: center;
    line-height: 1.35;
}

.v4-option-highlights { margin: 16px 0; }

.v4-highlight-item {
    background: var(--v4-cream);
    padding: 12px 16px;
    margin-bottom: 8px;
    border-radius: 12px;
    border-left: 4px solid var(--v4-primary);
    font-size: 0.88rem;
    color: var(--v4-text-medium);
    line-height: 1.5;
}

.v4-option-details {
    margin-top: 16px;
    background: var(--v4-cream);
    border-radius: 14px;
    padding: 18px;
}

.v4-detail-row {
    margin-bottom: 10px;
    line-height: 1.55;
    font-size: 0.88rem;
    color: var(--v4-text-medium);
}

.v4-detail-row:last-child { margin-bottom: 0; }

/* ── Freemium / Lock / Unlock ── */
.v4-freemium-badge {
    display: inline-block;
    background: var(--v4-primary);
    color: white;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-left: 10px;
}

.v4-unlock-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 2;
    text-align: center;
    background: white;
    padding: 28px;
    border-radius: 20px;
    box-shadow: 0 25px 80px rgba(0,0,0,0.15);
    border: 2px solid var(--v4-rose-pale);
}

.v4-unlock-overlay h4 {
    color: var(--v4-text);
    margin-bottom: 12px;
    font-family: 'Libre Baskerville', serif;
    font-size: 1.1rem;
    font-weight: 700;
}

.v4-unlock-overlay p {
    margin-bottom: 20px;
    color: var(--v4-text-muted);
    font-size: 0.88rem;
}

.v4-unlock-button {
    background: var(--v4-primary);
    color: white;
    border: none;
    padding: 14px 28px;
    border-radius: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    font-size: 0.95rem;
    box-shadow: 0 4px 15px rgba(161, 24, 87, 0.3);
}

.v4-unlock-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(161, 24, 87, 0.4);
}

.v4-option-slide.locked .v4-option-title,
.v4-option-slide.locked p,
.v4-option-slide.locked .v4-option-highlights {
    filter: blur(3px);
    opacity: 0.7;
    pointer-events: none;
}

.v4-option-slide.locked .v4-highlight-item {
    background: var(--v4-cream) !important;
    border-left-color: var(--v4-rose-pale) !important;
}

.v4-option-slide.locked .v4-unlock-overlay,
.v4-option-slide.locked .v4-unlock-overlay h4,
.v4-option-slide.locked .v4-unlock-overlay p,
.v4-option-slide.locked .v4-unlock-overlay button {
    filter: none !important;
    opacity: 1 !important;
    pointer-events: all;
}

/* ── Modal ── */
.v4-modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    overflow: auto;
}

.v4-modal-content {
    background-color: var(--v4-white);
    margin: 5% auto;
    padding: 32px;
    width: 80%;
    max-width: 680px;
    border-radius: 24px;
    box-shadow: 0 25px 80px rgba(0, 0, 0, 0.3);
    position: relative;
    max-height: 85vh;
    overflow-y: auto;
}

.v4-modal-close {
    position: absolute;
    right: 24px;
    top: 18px;
    font-size: 28px;
    font-weight: bold;
    color: var(--v4-text-muted);
    cursor: pointer;
    transition: color 0.2s;
}

.v4-modal-close:hover { color: var(--v4-primary); }

.v4-modal-header {
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 2px solid var(--v4-primary);
}

.v4-modal-title {
    font-family: 'Libre Baskerville', serif;
    color: var(--v4-text);
    font-size: 1.3rem;
    margin-bottom: 6px;
    font-weight: 700;
}

/* ── Actions (locked) ── */
.v4-action-item {
    background-color: var(--v4-white);
    border: 2px solid var(--v4-rose-pale);
    border-radius: 14px;
    padding: 18px 22px;
    margin-bottom: 14px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    transition: all 0.2s ease;
}

.v4-action-item:hover {
    border-color: var(--v4-primary);
    box-shadow: 0 6px 20px rgba(161, 24, 87, 0.1);
}

.v4-action-icon {
    width: 36px;
    height: 36px;
    background-color: var(--v4-rose-light);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--v4-primary);
    font-size: 1.1rem;
    flex-shrink: 0;
}

.v4-action-content { flex: 1; }

.v4-action-title {
    font-weight: 700;
    color: var(--v4-text);
    margin-bottom: 6px;
    font-size: 0.92rem;
}

.v4-action-desc {
    font-size: 0.85rem;
    color: var(--v4-text-medium);
    line-height: 1.6;
}

.v4-actions-unlock-overlay {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    text-align: center;
    background: white;
    padding: 20px 28px;
    border-radius: 20px;
    box-shadow: 0 25px 80px rgba(0,0,0,0.2);
    border: 2px solid var(--v4-rose-pale);
    min-width: 320px;
    max-width: 90vw;
    animation: v4SlideUp 0.5s ease-out;
}

.v4-actions-unlock-overlay h4 {
    color: var(--v4-text);
    margin-bottom: 10px;
    font-family: 'Libre Baskerville', serif;
    font-size: 1rem;
    font-weight: 700;
    border: none !important;
    padding-bottom: 0 !important;
}

.v4-actions-unlock-overlay p {
    margin-bottom: 14px;
    color: var(--v4-text-muted);
    font-size: 0.85rem;
    line-height: 1.5;
}

@keyframes v4SlideUp {
    from { transform: translateX(-50%) translateY(100px); opacity: 0; }
    to { transform: translateX(-50%) translateY(0); opacity: 1; }
}

.v4-action-item.locked .v4-action-content {
    filter: blur(2px);
    opacity: 0.6;
    pointer-events: none;
}

.v4-action-item.locked .v4-action-title { color: var(--v4-text-muted) !important; }
.v4-action-item.locked .v4-action-desc { color: var(--v4-text-muted) !important; }

/* ── Constraint cards ── */
.v4-constraint-cards { margin-top: 14px; }

.v4-constraint-item {
    background-color: var(--v4-white);
    border: 1px solid var(--v4-rose-pale);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 8px;
    font-size: 0.88rem;
    color: var(--v4-text-medium);
    line-height: 1.5;
}


/* ============================================================
   RESPONSIVE
   ============================================================ */
   @media (max-width: 1024px) {
    .v4-nav-step {
        padding: 6px 8px;
        font-size: 0.72rem;
    }
    .v4-nav-step span { display: none; }
    .v4-nav-step::after {
        content: attr(data-short);
        font-size: 0.72rem;
    }
    .v4-nav-separator { width: 8px; margin: 0 2px; }
}

@media (max-width: 768px) {
    .analysis-mvp-page {
        background: var(--v4-white);
        padding: 0;
    }

    .v4-container {
        min-height: 100vh;
        border-radius: 0;
        box-shadow: none;
    }

    .v4-header, .v4-module-container {
        padding: 16px 20px;
    }

    .v4-main-navigation { padding: 12px 10px; }

    .v4-nav-steps {
        min-width: max-content;
        gap: 4px;
        padding: 0 8px;
    }

    .v4-nav-step {
        padding: 6px 8px;
        font-size: 0.68rem;
        flex-shrink: 0;
        min-width: 56px;
        justify-content: center;
    }

    .v4-nav-step-number {
        width: 18px;
        height: 18px;
        font-size: 0.65rem;
        margin-right: 4px;
    }

    .v4-nav-separator { width: 8px; margin: 0 1px; flex-shrink: 0; }

    .v4-transformation-card {
        flex-direction: row;
        text-align: left;
    }

    .v4-before-quote, .v4-after-quote { min-height: 90px; }

    .v4-option-slide { padding: 20px 16px; }
    .v4-option-title { font-size: 1rem; }
    .v4-highlight-item { padding: 10px 12px; }

    .v4-welcome-screen { padding: 12px 16px 24px; }
    .v4-welcome-video-placeholder { max-width: 100%; }
    .v4-welcome-options { grid-template-columns: 1fr; }

    .v4-actions-unlock-overlay {
        bottom: 16px;
        left: 16px;
        right: 16px;
        transform: none;
        min-width: auto;
        padding: 16px 20px;
    }

    .v4-nav-container {
        scrollbar-width: thin;
        scrollbar-color: var(--v4-rose-pale) transparent;
    }

    .v4-nav-container::-webkit-scrollbar { height: 3px; }
    .v4-nav-container::-webkit-scrollbar-track { background: transparent; }
    .v4-nav-container::-webkit-scrollbar-thumb { background: var(--v4-rose-pale); border-radius: 2px; }
}

@media (min-width: 768px) {
    .v4-transformation-card {
        flex-direction: row;
        text-align: left;
    }
    .v4-before-quote, .v4-after-quote { min-height: 100px; }
}

@media (max-width: 600px) {
    .v4-pricing-grid { grid-template-columns: 1fr; }
    .v4-booking-slots-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 480px) {
    .v4-stat-cards { grid-template-columns: 1fr; }
    .v4-stat-tags { justify-content: center; }

    .v4-main-navigation { padding: 8px 4px; }
    .v4-nav-steps { gap: 2px; padding: 0; }
    .v4-nav-step {
        padding: 5px 6px;
        min-width: 0;
        font-size: 0;
        border-width: 1.5px;
        border-radius: 8px;
    }
    .v4-nav-step span { display: none; }
    .v4-nav-step::after {
        content: attr(data-short);
        font-size: 0.6rem;
    }
    .v4-nav-step-number {
        width: 16px;
        height: 16px;
        font-size: 0.55rem;
        margin-right: 3px;
        border-width: 1.5px;
    }
    .v4-nav-separator { width: 3px; margin: 0; }
}

/* ── Validation erreurs ── */
.v4-field-error input,
.v4-field-error textarea {
    border-color: #dc2626 !important;
    box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    animation: v4-shake 0.4s ease;
}

.v4-field-error-msg {
    display: flex;
    align-items: center;
    gap: 5px;
    color: #dc2626;
    font-size: 0.76rem;
    font-weight: 600;
    margin-top: 6px;
    padding-left: 4px;
}

.v4-field-error-msg::before {
    content: '⚠';
    font-size: 0.8rem;
}

/* float-label passe rouge aussi */
.v4-field-error.v4-float-field input:not(:placeholder-shown) + label,
.v4-field-error.v4-float-field input:focus + label {
    color: #dc2626;
}

@keyframes v4-shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-5px); }
    40% { transform: translateX(5px); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(3px); }
}

/* ── Coach banner (photo Anne) ── */
.v4-coach-banner {
    display: flex;
    align-items: center;
    gap: 20px;
    background: var(--v4-rose-light);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
}
.v4-coach-banner-photo {
    width: 96px;
    height: 96px;
    border-radius: 16px;
    object-fit: cover;
    flex-shrink: 0;
    box-shadow: 0 6px 20px rgba(0,0,0,0.1);
}
.v4-coach-banner-name {
    font-family: 'Libre Baskerville', serif;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--v4-text);
    margin-bottom: 4px;
}
.v4-coach-banner-role {
    font-size: 0.8rem;
    color: var(--v4-text-medium);
    line-height: 1.5;
    margin-bottom: 6px;
}
.v4-coach-banner-stats {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}
.v4-coach-banner-stat {
    background: var(--v4-white);
    border: 1px solid var(--v4-border);
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--v4-primary);
}

@media (max-width: 600px) {
    .v4-coach-banner {
        flex-direction: column;
        text-align: center;
    }
    .v4-coach-banner-stats {
        justify-content: center;
    }
}


/* ── Float-label fields ── */
.v4-booking-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 0;
}

.v4-float-field {
    position: relative;
    margin-bottom: 16px;
}

.v4-float-field input {
    width: 100%;
    padding: 18px 44px 8px 14px;
    border: 2px solid var(--v4-border);
    border-radius: 14px;
    font-size: 0.92rem;
    font-family: inherit;
    background: var(--v4-white);
    transition: all 0.25s ease;
    color: var(--v4-text);
    box-sizing: border-box;
}

.v4-float-field input:focus {
    outline: none;
    border-color: var(--v4-primary);
    box-shadow: 0 0 0 4px rgba(161, 24, 87, 0.08);
}

.v4-float-field input::placeholder { color: transparent; }

.v4-float-field label {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.88rem;
    color: var(--v4-text-muted);
    pointer-events: none;
    transition: all 0.2s ease;
    background: var(--v4-white);
    padding: 0 4px;
    margin-bottom: 0;
    font-weight: 400;
}

.v4-float-field input:focus + label,
.v4-float-field input:not(:placeholder-shown) + label {
    top: 0;
    font-size: 0.72rem;
    color: var(--v4-primary);
    font-weight: 600;
}

.v4-field-icon {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.95rem;
    opacity: 0.3;
    transition: opacity 0.2s;
    pointer-events: none;
}

.v4-float-field input:focus ~ .v4-field-icon { opacity: 0.7; }

@media (max-width: 600px) {
    .v4-booking-row { grid-template-columns: 1fr; }
}

/* ── SVG icons dans module-icon ── */
.v4-module-icon svg {
    width: 20px;
    height: 20px;
    stroke: var(--v4-primary);
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
}

/* ── Piste icon: emoji + numéro empilés ── */
.v4-piste-icon {
    width: 52px;
    height: 52px;
    background: var(--v4-rose-light);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    flex-shrink: 0;
}

.v4-piste-icon .emoji {
    font-size: 1.3rem;
    line-height: 1;
}

.v4-piste-icon .piste-num {
    font-size: 0.5rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--v4-primary);
    line-height: 1;
}

/* ── Piste header fusionné ── */
.v4-piste-info {
    flex: 1;
}

.v4-piste-option-label {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--v4-primary);
    margin-bottom: 4px;
}

.v4-piste-job {
    font-family: 'Libre Baskerville', serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--v4-text);
}

/* Variante 3 colonnes */
.v4-welcome-options--3cols {
    grid-template-columns: 1fr 1fr 1fr;
}

/* Le gap de 5rem est aussi trop large, passez-le à quelque chose de raisonnable */
.v4-welcome-options {
    gap: 12px;  /* au lieu de 5rem */
}

@media (max-width: 768px) {
    .v4-welcome-options,
    .v4-welcome-options--3cols {
        grid-template-columns: 1fr;
    }
}
/* ── Locked feedback badge (Prop C) ── */
.v4-option-locked {
    background: transparent !important;
    border: none !important;
    pointer-events: none;
    cursor: default;
    justify-content: center;
    padding: 0 !important;
    max-width: 260px;
    margin: 0 auto;
}

.v4-option-locked:hover {
    transform: none !important;
    box-shadow: none !important;
}

.v4-locked-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 22px;
    border-radius: 12px;
    font-size: 0.84rem;
    font-weight: 600;
    animation: v4-lock-pop 0.4s ease;
}

.v4-locked-icon {
color:white!important;
}

.v4-locked-badge--retained {
    background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
    color: #065f46;
    box-shadow: 0 2px 8px rgba(5, 150, 105, 0.1);
}

.v4-locked-badge--dismissed {
    background: linear-gradient(135deg, #fef2f1 0%, #fde8e6 100%);
    color: #9D1000;
    box-shadow: 0 2px 8px rgba(107, 33, 168, 0.06);
}

.v4-locked-icon {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    font-weight: 700;
    color: white;
}

.v4-locked-badge--retained .v4-locked-icon { background: #059669; }
.v4-locked-badge--dismissed .v4-locked-icon { background: #9D1000; }

/* Override couleur texte dans contexte section2-feedback */
.v4-section2-feedback .v4-option-locked {
    background: transparent !important;
}

.v4-section2-feedback .v4-locked-badge--retained {
    color: #065f46 !important;
}

.v4-section2-feedback .v4-locked-badge--dismissed {
    color: #9D1000 !important;
}

.v4-section2-feedback .v4-locked-icon {
    color: white !important;
}

@keyframes v4-lock-pop {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
}




 /* Cacher éléments interactifs */
 .chat-widget{
        display: none !important;
    }

</style>
