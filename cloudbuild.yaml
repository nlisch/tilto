options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

steps:
  # Step 0: Build avec cache
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '--cache-from', 'gcr.io/$PROJECT_ID/quiz-app:latest',
      '-t', 'gcr.io/$PROJECT_ID/quiz-app:$BUILD_ID',
      '-t', 'gcr.io/$PROJECT_ID/quiz-app:latest',
      '.'
    ]

# Step 0b: Cache longue durée sur les images GCS
  - name: 'gcr.io/cloud-builders/gsutil'
    args:
      - '-m'
      - 'setmeta'
      - '-h'
      - 'Cache-Control:public, max-age=31536000, immutable'
      - 'gs://${_STORAGE_BUCKET}/production/**'
      
  # Step 1: Test de l'image
  - name: 'gcr.io/$PROJECT_ID/quiz-app:$BUILD_ID'
    entrypoint: 'python'
    args:
      - '-c'
      - |
        import sys
        try:
            import flask
            print("✅ Flask OK")
            from flask_mysqldb import MySQL
            print("✅ Flask-MySQLdb OK")
            import stripe
            print("✅ Stripe OK")
            print("🎉 All modules OK")
        except ImportError as e:
            print(f"❌ Import error: {e}")
            sys.exit(1)
    env:
      - 'BUILDING_DOCKER=true'
  
  # Step 2: Build des assets
  - name: 'gcr.io/$PROJECT_ID/quiz-app:$BUILD_ID'
    entrypoint: 'python'
    args:
      - '-c'
      - |
        import os
        import sys
        
        os.environ['BUILDING_DOCKER'] = 'true'
        
        print("🔨 Building Flask-Assets bundles...")
        
        try:
            from app import create_app
            
            app = create_app()
            
            print("📦 Creating asset directories...")
            os.makedirs('static/dist/css', exist_ok=True)
            os.makedirs('static/dist/js', exist_ok=True)
            
            print("🔨 Building assets...")
            with app.app_context():
                assets_env = app.jinja_env.assets_environment
                
                bundles_built = 0
                for bundle_name, bundle in assets_env._named_bundles.items():
                    print(f"  Building {bundle_name}...")
                    urls = bundle.urls()
                    bundles_built += 1
                    print(f"    ✅ {bundle_name}")
                
                print(f"✅ Built {bundles_built} bundles")
                
                # Vérification
                required = [
                    'static/dist/css/main.min.css',
                    'static/dist/js/common.min.js',
                    'static/dist/js/quiz.min.js',
                    'static/dist/js/async_analysis.min.js'
                ]
                
                for f in required:
                    if os.path.exists(f):
                        size = os.path.getsize(f)
                        print(f"  ✅ {f} ({size} bytes)")
                    else:
                        print(f"  ❌ {f} NOT FOUND")
                        sys.exit(1)
                
                print("🎉 Assets built successfully!")
                
        except Exception as e:
            print(f"❌ Error: {e}")
            import traceback
            traceback.print_exc()
            sys.exit(1)
    env:
      - 'BUILDING_DOCKER=true'
      
  # Step 3: Push des images
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/quiz-app:$BUILD_ID']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/quiz-app:latest']
    
  # Step 4: Déploiement
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'quiz-app'
      - '--image'
      - 'gcr.io/$PROJECT_ID/quiz-app:$BUILD_ID'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--service-account'
      - '${_SERVICE_ACCOUNT}'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--port'
      - '8080'
      - '--timeout'
      - '300s'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '10'
      - '--concurrency'
      - '80'
      - '--cpu-throttling'
      - '--set-env-vars'
      - 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID,INIT_DB=False'
      - '--set-secrets'
      - 'APP_CONFIG=app-config:latest'
      - '--no-traffic'
      - '--tag'
      - 'new-version'
      
  # Step 5: Test de santé
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "⏳ Attente du démarrage du service..."
        sleep 60
        
        SERVICE_URL=$$(gcloud run services describe quiz-app --region=europe-west1 --format='value(status.url)')
        SERVICE_DOMAIN=$$(echo "$$SERVICE_URL" | sed 's|https://||')
        TEST_URL="https://new-version---$$SERVICE_DOMAIN"
        
        echo "🧪 Test de santé sur: $$TEST_URL/health"
        
        for i in {1..5}; do
          if curl -f -m 30 "$$TEST_URL/health"; then
            echo "✅ Service opérationnel!"
            break
          else
            echo "⚠️ Tentative $$i/5 échouée, retry dans 15s..."
            sleep 15
          fi
        done
        
        echo "🎉 Déploiement terminé!"
        
timeout: '2400s'
images:
  - 'gcr.io/$PROJECT_ID/quiz-app:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/quiz-app:latest'